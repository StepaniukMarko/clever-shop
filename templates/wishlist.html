{% extends "base.html" %}

{% block title %}Список бажань - Clever{% endblock %}

{% block content %}
<div class="wishlist-container">
    <div class="wishlist-header">
        <h1>♡ Список бажань</h1>
        <p>Товари, які ви зберегли для покупки</p>
    </div>
    
    <div class="wishlist-grid" id="wishlist-grid">
        <!-- Products will be loaded via JS -->
    </div>
    
    <div class="wishlist-empty" id="wishlist-empty" style="display:none;">
        <div class="wishlist-empty-icon">♡</div>
        <h3>Список бажань порожній</h3>
        <p>Додавайте товари, натискаючи на серце ♡ на картці товару</p>
        <a href="/#products" class="btn btn-primary" style="margin-top:1rem;">🛍️ Перейти до каталогу</a>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    loadWishlistPage();
});

function loadWishlistPage() {
    var wishlist = JSON.parse(storage.getItem('wishlist') || '[]');
    var grid = document.getElementById('wishlist-grid');
    var empty = document.getElementById('wishlist-empty');
    
    if (wishlist.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'block';
        return;
    }
    
    fetch('/api/products')
        .then(function(r) { return r.json(); })
        .then(function(products) {
            var wishlistProducts = products.filter(function(p) { return wishlist.includes(p.id); });
            
            if (wishlistProducts.length === 0) {
                grid.style.display = 'none';
                empty.style.display = 'block';
                return;
            }
            
            grid.innerHTML = wishlistProducts.map(function(p) {
                var imgHtml = p.image_url 
                    ? '<img src="' + p.image_url + '" alt="' + p.name + '" loading="lazy">'
                    : '<div class="no-image">📷</div>';
                return '<div class="product-card" onclick="if(!event.target.closest(\'button\')) window.location=\'/product/' + p.id + '\'">' +
                    '<div class="product-image-wrap">' + imgHtml +
                    '<button class="wishlist-btn active" onclick="event.stopPropagation(); removeFromWishlistPage(' + p.id + ')">♥</button>' +
                    '</div>' +
                    '<div class="product-info">' +
                    '<h3>' + p.name + '</h3>' +
                    '<p class="brand">' + (p.brand || '') + '</p>' +
                    '<p class="price">' + p.price.toLocaleString('uk-UA') + ' грн</p>' +
                    '</div>' +
                    '<div class="card-buttons">' +
                    '<button onclick="event.stopPropagation(); quickAddFromWishlist(' + p.id + ', \'' + p.name.replace(/'/g, "\\'") + '\', ' + p.price + ')" class="btn btn-primary btn-sm" style="width:100%;">🛒 В кошик</button>' +
                    '</div></div>';
            }).join('');
            
            grid.style.display = 'grid';
            empty.style.display = 'none';
        })
        .catch(function() {
            grid.style.display = 'none';
            empty.style.display = 'block';
        });
}

function removeFromWishlistPage(id) {
    var wishlist = JSON.parse(storage.getItem('wishlist') || '[]');
    var index = wishlist.indexOf(id);
    if (index > -1) {
        wishlist.splice(index, 1);
        storage.setItem('wishlist', JSON.stringify(wishlist));
        updateWishlistCount();
        loadWishlistPage();
        if (typeof showToast === 'function') showToast('Видалено зі списку', 'info');
    }
}

function quickAddFromWishlist(id, name, price) {
    var cart = JSON.parse(storage.getItem('cart') || '[]');
    var existing = cart.find(function(c) { return c.id == id; });
    if (existing) {
        existing.quantity++;
    } else {
        cart.push({ id: String(id), name: name, price: price, quantity: 1 });
    }
    storage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
    if (typeof showToast === 'function') showToast('Товар додано в кошик', 'success');
}
</script>
{% endblock %}
