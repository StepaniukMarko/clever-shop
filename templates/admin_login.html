{% extends "base.html" %}

{% block title %}Вхід в адмін-панель - Clever{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">🔐</div>
            <h1>Адмін-панель</h1>
            <p>Введіть дані для входу</p>
        </div>
        
        {% if error %}
        <div class="info-card" style="background:#FEE2E2;border-color:#FECACA;margin-bottom:1.5rem;">
            <p style="margin:0;color:#DC2626;">{{ error }}</p>
        </div>
        {% endif %}
        
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required placeholder="••••••••" autofocus>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Увійти</button>
        </form>
        
        <div class="auth-footer">
            <a href="/">← Повернутися на сайт</a>
        </div>
    </div>
</div>
{% endblock %}
