{% extends "base.html" %}

{% block title %}403 - Доступ заборонено | Clever{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-content">
        <div class="error-icon">🚫</div>
        <h1 class="error-title">403</h1>
        <h2 class="error-subtitle">Доступ заборонено</h2>
        <p class="error-text">
            У вас немає прав для доступу до цієї сторінки.
        </p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary btn-lg">🏠 На головну</a>
            <a href="/login" class="btn btn-secondary btn-lg">🔐 Увійти</a>
        </div>
    </div>
</div>

<style>
.error-container {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
    background: linear-gradient(135deg, #FEF3C7 0%, var(--white) 100%);
}

.error-content {
    text-align: center;
    max-width: 600px;
}

.error-icon {
    font-size: 6rem;
    margin-bottom: 1.5rem;
}

.error-title {
    font-size: 8rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--warning) 0%, #D97706 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 1rem;
}

.error-subtitle {
    font-size: 2rem;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 1rem;
}

.error-text {
    font-size: 1.1rem;
    color: var(--gray-600);
    margin-bottom: 2.5rem;
    line-height: 1.7;
}

.error-actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
}

@media (max-width: 768px) {
    .error-title {
        font-size: 5rem;
    }
    
    .error-subtitle {
        font-size: 1.5rem;
    }
    
    .error-actions {
        flex-direction: column;
    }
    
    .error-actions .btn {
        width: 100%;
    }
}
</style>
{% endblock %}
